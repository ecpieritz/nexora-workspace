<main class="account-created">
  <app-card class="account-created__card" padding="large" elevated>
    <app-brand class="account-created__brand" [showName]="false" size="small" />

    <div class="account-created__celebration" aria-hidden="true">
      <span class="account-created__confetti account-created__confetti--one"></span>
      <span class="account-created__confetti account-created__confetti--two"></span>
      <span class="account-created__confetti account-created__confetti--three"></span>
      <svg viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="30" fill="currentColor" opacity="0.1" />
        <path
          d="m19 32 9 9 18-20"
          fill="none"
          stroke="currentColor"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <div class="account-created__copy">
      <p class="account-created__eyebrow">Welcome to Nexora</p>
      <h1>Your account was created successfully.</h1>
      <p>
        Your demo credentials are saved in this browser. You can now sign in and start exploring.
      </p>
    </div>

    <button appButton type="button" size="large" routerLink="/auth/login">
      Continue to sign in
    </button>
  </app-card>
</main>
