<article class="top-products">
  <header>
    <div>
      <p>Ranking</p>
      <h2>Top selling products</h2>
    </div>
    <button type="button" aria-label="Top products options">•••</button>
  </header>

  <ol>
    @for (product of products(); track product.id) {
      <li>
        <span
          class="top-products__visual"
          [attr.data-visual]="product.productVisual"
          aria-hidden="true"
        >
          @if (product.productVisual === 'shoe') {
            <svg viewBox="0 0 64 40">
              <path d="M8 25c10-1 14-8 18-16 7 8 13 12 27 14 4 1 6 4 4 8H10c-5 0-6-5-2-6Z" />
            </svg>
          } @else {
            <svg viewBox="0 0 40 64">
              <rect x="8" y="2" width="24" height="60" rx="5" />
              <circle cx="20" cy="56" r="2" />
            </svg>
          }
        </span>
        <span class="top-products__details">
          <strong>{{ product.name }}</strong>
          <span
            class="top-products__rating"
            [attr.aria-label]="product.rating + ' out of 5 stars, ' + product.reviews + ' reviews'"
          >
            @for (star of stars; track star) {
              <span [class.top-products__star--filled]="star <= product.rating" aria-hidden="true"
                >★</span
              >
            }
          </span>
          <span class="top-products__price">{{
            product.price | currency: 'USD' : 'symbol' : '1.0-0'
          }}</span>
        </span>
      </li>
    }
  </ol>
</article>
