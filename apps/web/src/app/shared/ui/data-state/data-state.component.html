<div
  class="data-state"
  [class.data-state--loading]="kind() === 'loading'"
  [attr.role]="kind() === 'error' ? 'alert' : 'status'"
  [attr.aria-live]="kind() === 'error' ? 'assertive' : 'polite'"
>
  @if (kind() === 'loading') {
    <span class="data-state__spinner" aria-hidden="true"></span>
  } @else {
    <span class="data-state__icon" aria-hidden="true">{{ kind() === 'empty' ? '◇' : '!' }}</span>
  }
  <strong>{{ title() }}</strong>
  @if (message()) {
    <p>{{ message() }}</p>
  }
  @if (kind() === 'error') {
    <button type="button" (click)="action.emit()">{{ actionLabel() }}</button>
  }
</div>
